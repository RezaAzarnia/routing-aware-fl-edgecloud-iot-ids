# supplementary_v2 [R_regression] ciciot / sens_k1p5: regression control: unaffected CICIoT2023 central-DP configuration without client holdout (positive weights)
# identical to the locked SUPP_V1 config configs/supp_v1/ciciot_sens_k1p5.yaml (sha256 3296d8c7a8f97d29) except experiment.name / experiment.output_dir
# supplementary_v1 arm 'sens_k1p5' (ciciot) [B_sensitivity]: Proposed pipeline (eps~10): MAD coefficient k=1.5
# parent (locked Phase 6C): configs/phase6c/ciciot_reference_gaussian.yaml; only changes: {'aggregation.distance_k': 1.5}
# Locked by docs/supp_v2/EXPERIMENT_MANIFEST.json; do not edit.
aggregation:
  byzantine_assumption: 2
  distance_k: 1.5
  method: distance_filter
  trim_ratio: 0.2
attack:
  attack_scale: 5.0
  attack_type: sign_flip
  label_flip_probability: 1.0
  malicious_fraction: 0.2
  assignment: exposure_controlled
data:
  attack_category_col: attack_category
  calibration_fraction_of_test: 0.2
  calibration_stratify_attack_category: true
  categorical_cols: []
  dataset_name: ciciot2023
  drop_cols:
  - attack_category
  enable_calibrated_evaluation: false
  exclude_conflicting_train_groups: false
  label_col: label
  max_test_samples: null
  max_train_samples: null
  max_val_samples: null
  prepared_metadata_json: data/CICIoT2023/prepared_verified_v2_filegroup/preparation_metadata.json
  test_csv: ''
  train_csv: data/CICIoT2023/prepared_verified_v2_filegroup/train.csv.gz
  validation_csv: data/CICIoT2023/prepared_verified_v2_filegroup/validation.csv.gz
  validation_fraction: 0.15
  threshold_calibration_fraction: 0.0
  validation_three_way: true
experiment:
  create_plots: false
  deterministic: true
  device: cpu
  early_stopping_min_delta: 0.0001
  early_stopping_min_rounds: 18
  early_stopping_patience: null
  method_name: sens_k1p5
  name: supplementary_v2_ciciot_sens_k1p5
  output_dir: results_supplementary_v2
  save_probabilities: true
  seed: 2
  validation_only: true
  variant_name: sens_k1p5
  algorithm_version: reference_v1_historical
failure:
  accuracy_recovery_target_ratio: 0.95
  client_failure_probability: 0.1
  detection_delay_ms: 20.0
  enabled: true
  reconstruction_time_ms: 35.0
  recovery_enabled: true
  recovery_metric: f1
  recovery_min_future_rounds: 1
  recovery_smoothing_window: 3
  recovery_weight_factor: 0.5
fl:
  batch_size: 256
  clients_per_round: 10
  dirichlet_alpha: 0.5
  learning_rate: 0.0003
  local_epochs: 2
  min_client_samples: 100
  num_clients: 50
  partition: dirichlet
  rounds: 30
  server_learning_rate: 0.5
  server_momentum: 0.9
  weight_decay: 0.0
model:
  dropout: 0.2
  hidden_dims:
  - 128
  - 96
  - 64
privacy:
  mode: central_client
  clip_norm: 0.05
  noise_multiplier: 1.0
  delta: 1.0e-05
  target_epsilon: 10.0
  auto_calibrate_noise: true
  accountant_sample_rate: null
  max_client_weight_share: 0.1
  adjacency_factor: 1.0
routing:
  alpha_latency: 0.4
  beta_stability: 0.3
  dynamic_sigma: 0.025
  enabled: true
  gamma_security: 0.3
  link_outage_probability: 0.01
  num_edges: 3
  packets_per_update: 100
  trace_mode: matched
threshold:
  enabled: true
  grid_size: 1001
  max_fpr: 0.15
  min_recall: 0.6
  model_selection_metric: roc_auc
  objective: fpr_cap
  operating_fpr_caps:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
