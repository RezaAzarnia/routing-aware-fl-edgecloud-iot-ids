# supplementary_v1 arm 'part_topk_indep' (ciciot) [E_participation]: Phase-10 style: selection=top_k, network-data coupling=0.0, 20% client holdout, natural fixed attackers
# parent (locked Phase 6C): configs/phase6c/ciciot_ctl_delivery_coupled.yaml; only changes: {'attack.assignment': 'natural_fixed_clients', 'fl.client_holdout_fraction': 0.2, 'routing.selection_policy': 'top_k', 'routing.network_data_coupling': 0.0}
# Locked by docs/supp_v1/EXPERIMENT_MANIFEST.json; do not edit.
aggregation:
  byzantine_assumption: 2
  distance_k: 2.5
  method: distance_filter
  trim_ratio: 0.2
attack:
  attack_scale: 5.0
  attack_type: sign_flip
  label_flip_probability: 1.0
  malicious_fraction: 0.2
  assignment: natural_fixed_clients
data:
  attack_category_col: attack_category
  calibration_fraction_of_test: 0.2
  calibration_stratify_attack_category: true
  categorical_cols: []
  dataset_name: ciciot2023
  drop_cols:
  - attack_category
  enable_calibrated_evaluation: false
  exclude_conflicting_train_groups: false
  label_col: label
  max_test_samples: null
  max_train_samples: null
  max_val_samples: null
  prepared_metadata_json: data/CICIoT2023/prepared_verified_v2_filegroup/preparation_metadata.json
  test_csv: ''
  train_csv: data/CICIoT2023/prepared_verified_v2_filegroup/train.csv.gz
  validation_csv: data/CICIoT2023/prepared_verified_v2_filegroup/validation.csv.gz
  validation_fraction: 0.15
  threshold_calibration_fraction: 0.0
  validation_three_way: true
experiment:
  create_plots: false
  deterministic: true
  device: cpu
  early_stopping_min_delta: 0.0001
  early_stopping_min_rounds: 18
  early_stopping_patience: null
  method_name: part_topk_indep
  name: supplementary_v1_ciciot_part_topk_indep
  output_dir: results_supplementary_v1
  save_probabilities: true
  seed: 2
  validation_only: true
  variant_name: part_topk_indep
  algorithm_version: reference_v1_historical
failure:
  accuracy_recovery_target_ratio: 0.95
  client_failure_probability: 0.1
  detection_delay_ms: 20.0
  enabled: true
  reconstruction_time_ms: 35.0
  recovery_enabled: true
  recovery_metric: f1
  recovery_min_future_rounds: 1
  recovery_smoothing_window: 3
  recovery_weight_factor: 0.5
fl:
  batch_size: 256
  clients_per_round: 10
  dirichlet_alpha: 0.5
  learning_rate: 0.0003
  local_epochs: 2
  min_client_samples: 100
  num_clients: 50
  partition: dirichlet
  rounds: 30
  server_learning_rate: 0.5
  server_momentum: 0.9
  weight_decay: 0.0
  client_holdout_fraction: 0.2
model:
  dropout: 0.2
  hidden_dims:
  - 128
  - 96
  - 64
privacy:
  accountant_sample_rate: null
  adjacency_factor: 1.0
  auto_calibrate_noise: false
  clip_norm: 0.05
  delta: 1.0e-05
  max_client_weight_share: 0.1
  mode: none
  noise_multiplier: 1.0
  target_epsilon: null
routing:
  alpha_latency: 0.4
  beta_stability: 0.3
  dynamic_sigma: 0.025
  enabled: true
  gamma_security: 0.3
  link_outage_probability: 0.01
  num_edges: 3
  packets_per_update: 100
  trace_mode: matched
  delivery_model: packet_coupled
  selection_policy: top_k
  network_data_coupling: 0.0
threshold:
  enabled: true
  grid_size: 1001
  max_fpr: 0.15
  min_recall: 0.6
  model_selection_metric: roc_auc
  objective: fpr_cap
  operating_fpr_caps:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
