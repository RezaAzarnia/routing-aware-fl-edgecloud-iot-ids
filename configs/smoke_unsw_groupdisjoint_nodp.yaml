# SMOKE diagnostic (privacy off, no attack, plain FedAvg, 6 rounds). Validation-side only; test slot is a stand-in.
data:
  train_csv: data/UNSW_NB15_training-set.csv
  test_csv: data/UNSW_NB15_training-set.csv
  label_col: label
  attack_category_col: attack_cat
  drop_cols:
  - id
  - attack_cat
  categorical_cols:
  - proto
  - service
  - state
  validation_fraction: 0.15
  max_train_samples: 40000
  max_test_samples: 4000
  enable_calibrated_evaluation: false
  calibration_fraction_of_test: 0.2
  calibration_stratify_attack_category: true
  validation_split: group_disjoint
model:
  hidden_dims:
  - 128
  - 96
  - 64
  dropout: 0.2
fl:
  num_clients: 10
  clients_per_round: 5
  rounds: 6
  local_epochs: 1
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0
  server_learning_rate: 0.5
  server_momentum: 0.9
  partition: dirichlet
  dirichlet_alpha: 0.5
  min_client_samples: 50
privacy:
  mode: none
  clip_norm: 0.1
  noise_multiplier: 1.0
  delta: 1.0e-05
  target_epsilon: null
  auto_calibrate_noise: false
  accountant_sample_rate: null
  max_client_weight_share: 0.1
  adjacency_factor: 1.0
threshold:
  enabled: true
  objective: fpr_cap
  max_fpr: 0.15
  min_recall: 0.6
  grid_size: 201
  model_selection_metric: roc_auc
  operating_fpr_caps:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
aggregation:
  method: fedavg
  trim_ratio: 0.2
  distance_k: 2.5
  byzantine_assumption: 2
attack:
  attack_type: none
  malicious_fraction: 0.0
  attack_scale: 5.0
  label_flip_probability: 1.0
failure:
  enabled: true
  client_failure_probability: 0.1
  recovery_enabled: true
  recovery_weight_factor: 0.5
  detection_delay_ms: 20.0
  reconstruction_time_ms: 35.0
  accuracy_recovery_target_ratio: 0.95
  recovery_metric: f1
  recovery_min_future_rounds: 1
  recovery_smoothing_window: 3
routing:
  enabled: true
  num_edges: 3
  alpha_latency: 0.4
  beta_stability: 0.3
  gamma_security: 0.3
  dynamic_sigma: 0.025
  link_outage_probability: 0.01
  packets_per_update: 100
experiment:
  name: smoke_unsw_groupdisjoint_nodp
  method_name: smoke_proposed
  output_dir: results_smoke_no_official_test
  seed: 1
  device: cpu
  deterministic: true
  save_probabilities: true
  early_stopping_patience: null
  early_stopping_min_rounds: 18
  early_stopping_min_delta: 0.0001
  create_plots: false
